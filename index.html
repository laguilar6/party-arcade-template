<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sarah's Birthday Adventure</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="screen-start" class="screen">
      <div class="title-container">
        <img src="assets/old assets/logo-titulo.png" alt="Sarah's Birthday Adventure" class="img-title">
      </div>
      <div class="hero-art">
        <img src="assets/old assets/castillo-bg.png" class="img-castillo" alt="Castillo">
        <img src="assets/old assets/luigi-portada.png" class="img-luigi-cover" alt="Luigi">
      </div>
      <div class="start-panel">
        <p class="panel-text">LUIGI NEEDS YOUR HELP!</p>
        <div class="start-btn-container">
          <img src="assets/old assets/btn-start.png" id="btn-start" class="btn-start-img" alt="START">
          <img src="assets/old assets/coin-slot.png" class="coin-slot-img" alt="Coin Slot">
        </div>
        <p class="insert-coin">INSERT COIN TO CONTINUE</p>
      </div>
    </div>

    <div id="screen-game" class="screen hidden">
      <div id="phaser-game"></div>
      <div class="gamepad-container">
        <div class="dpad-wrapper">
          <img src="assets/controls/arrows.png" class="dpad-img" alt="D-Pad">
          <div id="btn-left" class="touch-zone zone-left"></div>
          <div id="btn-right" class="touch-zone zone-right"></div>
        </div>
        <img src="assets/old assets/btn-a.png" id="btn-action-a" class="btn-a-img" alt="Botón A">
      </div>
    </div>

    <div id="screen-victory" class="screen hidden">
      <div class="victory-card">
        <h1 class="victory-title">YOU DID IT!</h1>
        <h2 class="victory-subtitle">PARTY UNLOCKED!</h2>
        <div class="details-box">
          <p><strong>SARAH'S PARTY DETAILS:</strong></p>
          <p>DATE: Saturday, October 26th</p>
          <p>TIME: 7:00 PM</p>
          <p>LOCATION: [Venue Address]</p>
          <p>DRESS CODE: Green!</p>
        </div>
        <form id="rsvp-form" class="rsvp-form">
          <input type="text" placeholder="Enter Your Name" required class="pixel-input">
          <button type="submit" class="btn-accept">ACCEPT QUEST!</button>
        </form>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
